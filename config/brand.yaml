# ─────────────────────────────────────────────────────────────
#  Identidad y línea editorial de la cuenta. Todo es editable.
# ─────────────────────────────────────────────────────────────

brand:
  name: "The TechBridge Solution"
  handle: "@thetechbridgesolution"
  website: "https://thetechbridgesolution.com"
  logo_url: "https://thetechbridgesolution.com/wp-content/uploads/2025/07/thetechbridgesolution-logo.png"
  # Frase fija del cierre de cada Reel: deja claro quién sabe de esto, sin vender nada
  tagline: "Formación en Microsoft 365 e IA para equipos"
  # Qué hace la empresa (el guionista lo usa para que los temas tengan coherencia)
  about: >
    Consultora española de formación y servicios en Microsoft 365 e IA aplicada al trabajo:
    Copilot, ChatGPT, Power BI, SharePoint, automatización y productividad. Forma a profesionales,
    mandos intermedios y directivos para que trabajen mejor con tecnología.

audience: >
  Profesionales de 35 a 60 años: directivos, mandos intermedios, dueños de pymes, autónomos y
  responsables de equipo en España y Latinoamérica. Les interesa la empresa, la productividad y
  entender qué está pasando con la IA sin tecnicismos. Valoran el criterio, no el ruido.

tone: >
  Español de España, claro y con criterio. Cercano pero profesional, nunca infantil ni de "gurú".
  Frases cortas, datos concretos, curiosidad. Cero venta directa: el objetivo es que el vídeo
  interese tanto que la gente siga la cuenta por sí misma.

# Colores de la marca (thetechbridgesolution.com): degradado #015DAC → #267FCB, carbón #282828 y violeta #5F2DDE
# como secundario puntual. Cada formato usa una variación de esta paleta (campo `accent` de cada formato).
# Si el contenido va de una aplicación con color propio (Excel, Teams…), se usa el de esa aplicación (app_colors).
visual:
  background: "#03132A"
  text: "#F5F9FF"
  muted: "#93A6C2"
  accents:
    - ["#015DAC", "#267FCB"]   # degradado de la web
    - ["#267FCB", "#5AAEEE"]   # azul marca → azul claro
    - ["#1C5B92", "#267FCB"]   # azul profundo → azul marca
    - ["#267FCB", "#A9D4F7"]   # azul marca → cielo (para "dato")
    - ["#015DAC", "#5F2DDE"]   # azul profundo → violeta secundario
    - ["#267FCB", "#9D86F5"]   # azul marca → violeta claro
    - ["#5AAEEE", "#015DAC"]   # azul claro → profundo
  # [color oscuro, color claro] de cada aplicación
  app_colors:
    excel: ["#1D6F42", "#33C481"]
    word: ["#185ABD", "#41A5EE"]
    powerpoint: ["#C43E1C", "#FF8F6B"]
    outlook: ["#0F6CBD", "#28A8EA"]
    teams: ["#4B53BC", "#7B83EB"]
    onenote: ["#7719AA", "#CA64EA"]
    sharepoint: ["#036C70", "#37C6D0"]
    onedrive: ["#0364B8", "#28A8EA"]
    powerbi: ["#9E7F00", "#F2C811"]
    powerautomate: ["#0066FF", "#5C9DFF"]
    chatgpt: ["#0E8C69", "#19C37D"]
    gemini: ["#1A73E8", "#8AB4F8"]
    github: ["#6E40C9", "#A371F7"]
  # Palabras que delatan cada aplicación en el tema de una pieza
  app_keywords:
    excel: ["excel"]
    word: ["word"]
    powerpoint: ["powerpoint"]
    outlook: ["outlook"]
    teams: ["teams"]
    onenote: ["onenote"]
    sharepoint: ["sharepoint"]
    onedrive: ["onedrive"]
    powerbi: ["power bi", "powerbi"]
    powerautomate: ["power automate"]
    chatgpt: ["chatgpt", "openai"]
    gemini: ["gemini"]
    github: ["github"]

# Referencias de estilo (vídeos en video/example). Se usan como INSPIRACIÓN para estructurar guiones y escenas:
# nunca se copian tal cual, y todo va con la paleta de la marca.
references: |
  - preview.mp4 (estilo actual de historias): insignia del formato, objeto 3D del producto, titular grande y
    puntos numerados en tarjetas.
  - v1_reel (prompting): cabecera fija "The TechBridge Solution | tema", titular centrado con la palabra clave en
    color, un prompt que se escribe en una ventana resaltando sus partes clave, y una explicación en "piezas"
    (Rol, Tarea, Formato) con un objeto 3D por pieza. Cierre: "Guárdalo para…" y dónde funciona.
  - v2_reel (noticia): fondo claro, etiqueta NOTICIA + medio y fecha, objetos que se ordenan (de caos a cuadrícula)
    como metáfora de lo que hace la novedad, capítulos "QUÉ HACE · 1/3", un dato de DISPONIBILIDAD con fuente y un
    cierre que conecta con el día a día.
  - v3_reel (errores frecuentes): numeración grande "ERROR 01/02/03", cada error con un objeto 3D sobre pedestal
    que lo simboliza (maletín, pila de documentos, lupa) y una tarjeta "MEJOR ASÍ" con la alternativa correcta.
  - v4_truco (truco en 20 s): "Truco en 20 segundos · App", teclas 3D que se pulsan, el resultado real (una tabla
    que aparece fila a fila) con 2-3 ventajas numeradas, un "bonus" con otro atajo y cierre "Guárdalo y pruébalo hoy".
  Ideas que se repiten y funcionan: una sola idea por escena, metáfora visual del problema → solución, numerar las
  partes, enseñar el resultado concreto, y cerrar con una acción (guardar, probar, compartir).

# Formatos que se van rotando para que haya variedad.
#   needs_news: true  → se basa en una noticia real de las fuentes
#   needs_news: false → contenido "evergreen" (trucos, ideas) que no necesita noticia
formats:
  noticia:
    needs_news: true
    accent: 0
    label: "NOTICIA"
    brief: "Una novedad real de esta semana y por qué le importa a alguien que dirige o trabaja en una empresa."
  dato:
    needs_news: true
    accent: 3
    label: "EL DATO"
    brief: "Un dato llamativo SACADO DE LA NOTICIA (nunca inventado) y lo que significa en la práctica."
  tendencia:
    needs_news: true
    accent: 1
    label: "TENDENCIA"
    brief: "Qué están haciendo las empresas que van por delante, a partir de una noticia real."
  truco:
    needs_news: false
    accent: 2
    label: "TRUCO"
    brief: "Un truco concreto y real de Microsoft 365, Copilot, ChatGPT, Excel, Outlook o Teams que ahorra tiempo de verdad."
  prompt:
    needs_news: false
    accent: 4
    label: "PROMPT DEL DÍA"
    brief: "Un prompt útil para el trabajo (correo difícil, resumen de reunión, análisis de datos...) mostrado en una ventana de chat animada."
  antes_despues:
    needs_news: false
    accent: 5
    label: "ANTES vs AHORA"
    brief: "Cómo cambia una tarea cotidiana de oficina con IA o automatización. Comparación visual."
  mito:
    needs_news: false
    accent: 6
    label: "MITO O REALIDAD"
    brief: "Un mito frecuente sobre la IA o la tecnología en la empresa y la realidad, con matices."

# Productos con los que trabaja la empresa. Todo el contenido (Reels e historias) gira alrededor de ellos:
# las noticias se filtran con estas palabras clave y el guionista elige el objeto 3D (hero) del producto.
# hero: ia · excel · correo · reuniones · datos · documentos · presentaciones · automatizacion
products:
  - {name: "Microsoft 365 Copilot", hero: ia, keywords: ["copilot", "microsoft 365", "m365", "office 365"]}
  - {name: "ChatGPT", hero: ia, app: chatgpt, keywords: ["chatgpt", "gpt-", "openai"]}
  - {name: "Excel", app: excel, hero: excel, keywords: ["excel"]}
  - {name: "Outlook", app: outlook, hero: correo, keywords: ["outlook"]}
  - {name: "Teams", app: teams, hero: reuniones, keywords: ["teams"]}
  - {name: "Power BI", app: powerbi, hero: datos, keywords: ["power bi", "powerbi", "fabric"]}
  - {name: "Word", app: word, hero: documentos, keywords: ["microsoft word", "word document", "en word"]}
  - {name: "PowerPoint", app: powerpoint, hero: presentaciones, keywords: ["powerpoint"]}
  - {name: "SharePoint y OneDrive", app: sharepoint, hero: documentos, keywords: ["sharepoint", "onedrive", "microsoft loop"]}
  - {name: "Power Automate, Power Apps y Copilot Studio", app: powerautomate, hero: automatizacion, keywords: ["power automate", "power apps", "power platform", "copilot studio"]}

