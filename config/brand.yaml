# ─────────────────────────────────────────────────────────────
#  Identidad y línea editorial de la cuenta. Todo es editable.
# ─────────────────────────────────────────────────────────────

brand:
  name: "The TechBridge Solution"
  handle: "@thetechbridgesolution"
  website: "https://thetechbridgesolution.com"
  logo_url: "https://thetechbridgesolution.com/wp-content/uploads/2025/07/thetechbridgesolution-logo.png"
  # Frase fija del cierre de cada Reel: deja claro quién sabe de esto, sin vender nada
  tagline: "Formación en Microsoft 365 e IA para equipos"
  # Qué hace la empresa (el guionista lo usa para que los temas tengan coherencia)
  about: >
    Consultora española de formación y servicios en Microsoft 365 e IA aplicada al trabajo:
    Copilot, ChatGPT, Power BI, SharePoint, automatización y productividad. Forma a profesionales,
    mandos intermedios y directivos para que trabajen mejor con tecnología.

audience: >
  Profesionales de 35 a 60 años: directivos, mandos intermedios, dueños de pymes, autónomos y
  responsables de equipo en España y Latinoamérica. Les interesa la empresa, la productividad y
  entender qué está pasando con la IA sin tecnicismos. Valoran el criterio, no el ruido.

tone: >
  Español de España, claro y con criterio. Cercano pero profesional, nunca infantil ni de "gurú".
  Frases cortas, datos concretos, curiosidad. Cero venta directa: el objetivo es que el vídeo
  interese tanto que la gente siga la cuenta por sí misma.

# Paletas de acento. Cada formato tiene la suya (campo `accent` de cada formato), así el vídeo y la portada
# comparten color y en el perfil se reconoce cada formato de un vistazo.
visual:
  background: "#070B18"
  text: "#F5F7FF"
  muted: "#9AA4C7"
  accents:
    - ["#3B82F6", "#22D3EE"]   # azul eléctrico → cian
    - ["#7C3AED", "#3B82F6"]   # violeta → azul
    - ["#06B6D4", "#10B981"]   # cian → verde
    - ["#F59E0B", "#EF4444"]   # ámbar → rojo (para "dato impactante")
    - ["#6366F1", "#EC4899"]   # índigo → magenta
    - ["#0EA5E9", "#A855F7"]   # celeste → púrpura
    - ["#22C55E", "#EAB308"]   # verde → amarillo

# Formatos que se van rotando para que haya variedad.
#   needs_news: true  → se basa en una noticia real de las fuentes
#   needs_news: false → contenido "evergreen" (trucos, ideas) que no necesita noticia
formats:
  noticia:
    needs_news: true
    accent: 0
    label: "NOTICIA"
    brief: "Una novedad real de esta semana y por qué le importa a alguien que dirige o trabaja en una empresa."
  dato:
    needs_news: true
    accent: 3
    label: "EL DATO"
    brief: "Un dato llamativo SACADO DE LA NOTICIA (nunca inventado) y lo que significa en la práctica."
  tendencia:
    needs_news: true
    accent: 1
    label: "TENDENCIA"
    brief: "Qué están haciendo las empresas que van por delante, a partir de una noticia real."
  truco:
    needs_news: false
    accent: 2
    label: "TRUCO"
    brief: "Un truco concreto y real de Microsoft 365, Copilot, ChatGPT, Excel, Outlook o Teams que ahorra tiempo de verdad."
  prompt:
    needs_news: false
    accent: 4
    label: "PROMPT DEL DÍA"
    brief: "Un prompt útil para el trabajo (correo difícil, resumen de reunión, análisis de datos...) mostrado en una ventana de chat animada."
  antes_despues:
    needs_news: false
    accent: 5
    label: "ANTES vs AHORA"
    brief: "Cómo cambia una tarea cotidiana de oficina con IA o automatización. Comparación visual."
  mito:
    needs_news: false
    accent: 6
    label: "MITO O REALIDAD"
    brief: "Un mito frecuente sobre la IA o la tecnología en la empresa y la realidad, con matices."

# Productos con los que trabaja la empresa. Todo el contenido (Reels e historias) gira alrededor de ellos:
# las noticias se filtran con estas palabras clave y el guionista elige el objeto 3D (hero) del producto.
# hero: ia · excel · correo · reuniones · datos · documentos · presentaciones · automatizacion
products:
  - {name: "Microsoft 365 Copilot", hero: ia, keywords: ["copilot", "microsoft 365", "m365", "office 365"]}
  - {name: "ChatGPT", hero: ia, keywords: ["chatgpt", "gpt-", "openai"]}
  - {name: "Excel", hero: excel, keywords: ["excel"]}
  - {name: "Outlook", hero: correo, keywords: ["outlook"]}
  - {name: "Teams", hero: reuniones, keywords: ["teams"]}
  - {name: "Power BI", hero: datos, keywords: ["power bi", "powerbi", "fabric"]}
  - {name: "Word", hero: documentos, keywords: ["microsoft word", "word document", "en word"]}
  - {name: "PowerPoint", hero: presentaciones, keywords: ["powerpoint"]}
  - {name: "SharePoint y OneDrive", hero: documentos, keywords: ["sharepoint", "onedrive", "microsoft loop"]}
  - {name: "Power Automate, Power Apps y Copilot Studio", hero: automatizacion, keywords: ["power automate", "power apps", "power platform", "copilot studio"]}

# Fuentes de noticias (RSS/Atom). Si alguna falla, se ignora y sigue.
sources:
  - "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=Microsoft365InsiderBlog"
  - "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=ExcelBlog"
  - "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=MicrosoftTeamsBlog"
  - "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=SPBlog"
  - "https://powerbi.microsoft.com/en-us/blog/feed/"
  - "https://www.microsoft.com/en-us/microsoft-365/blog/feed/"
  - "https://blogs.microsoft.com/feed/"
  - "https://openai.com/news/rss.xml"
  - "https://blog.google/technology/ai/rss/"
  - "https://techcrunch.com/category/artificial-intelligence/feed/"
  - "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  - "https://feeds.weblogssl.com/xataka2"

# Revisión por email antes de publicar (horas en hora de Madrid)
review:
  timezone: "Europe/Madrid"
  generate_hour: 2        # se genera el vídeo del día
  email_hour: 10          # le llega el correo con el vídeo para aprobar
  regenerate_hour: 17     # si pide otro, se genera y se le envía a esta hora
  publish_after: "19:00"  # si lo aprueba, se publica a esta hora (si aprueba más tarde, al momento)

audio:
  # Proporción de vídeos con voz en off (si hay clave de ElevenLabs). El resto, música + texto.
  voice_ratio: 0.5
  music_volume_with_voice: 0.12
  music_volume_alone: 0.55

# Texto del post. El guionista escribe el cuerpo y unos hashtags del tema; esto se añade siempre al final
# para que todas las publicaciones cierren igual. Instagram admite como mucho 5 hashtags por publicación.
caption:
  footer: "Cada día, una idea práctica de IA y Microsoft 365 para tu trabajo. Síguenos en @thetechbridgesolution"
  brand_hashtags: ["#TheTechBridgeSolution"]
  max_hashtags: 5

# Claude se usa con tu suscripción. Tus horas de trabajo con Claude son de 9:00 a 14:00 y el límite va por
# ventanas de 5 horas que empiezan con la primera petición: si el agente pidiera algo después de las 4:00, su
# ventana seguiría abierta a las 9:00. Por eso el agente solo usa Claude fuera de esta franja; lo que llegue
# dentro (por ejemplo, historias pedidas por correo) espera a que acabe.
claude:
  quiet_from: "04:00"
  quiet_to: "14:00"

# Historias de Instagram: se preparan de madrugada junto al Reel y se publican a horas al azar.
stories:
  per_day: 3
  window: ["09:00", "21:00"]
  min_gap_minutes: 120
  # A esta hora se mira si ha salido algo importante sobre los productos y, si lo hay, se añade una historia
  # de "Última hora" para la tarde (solo una al día y solo si de verdad es relevante).
  news_check: "15:00"
